# =====================================================================
# Deploy: publishes the prod branch to GitHub Pages.
# Runs when the pipeline moves prod forward (or when you run it by hand
# from the Actions tab on the prod branch).
# =====================================================================
name: Deploy prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run unit tests (last safety check)
        run: npm test
      - name: Collect only the website files
        run: |
          mkdir _site
          cp -R index.html about.html diet.html privacy.html css js assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
